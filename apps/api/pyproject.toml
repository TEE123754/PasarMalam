[project]
name = "pasarmalam-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "pyjwt[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "qrcode==8.2",
  "pillow>=12,<13",
  "pywebpush>=2.0,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "pytest>=8,<10",
    "pglast>=7,<8",
    "imageio-ffmpeg>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires an explicitly configured disposable Supabase project"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long SQL literals/canonical table catalogue are kept intact; executable Python is formatted.
"**/scripts/*.py" = ["E501"]
