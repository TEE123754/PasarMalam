<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PasarMalam Hero Intro</title>
<style>
  /* Layout: full-screen splash with forest-green frame, cream interior, massive bleed type */
  :root {
    --green-frame:   #17443e;
    --green-primary: #1c5a45;
    --green-ink:     #18332f;
    --cream:         #f8f7f2;
    --gold:          #f5be73;
    --terracotta:    #d97c40;
    --muted:         #7a8c83;
    --border:        #e9e9dd;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  /* Force single-theme — this is a branded splash, deliberately dark-framed */
  :root { color-scheme: light; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--green-frame);
    min-height: 100vh;
    display: flex;
    align-items: stretch;
    padding: 12px;
  }

  /* ── Keyframes ── */
  @keyframes slideLeft  { from { transform: translateX(-80px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }
  @keyframes slideRight { from { transform: translateX( 80px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }
  @keyframes riseFade   { from { transform: translateY(30px) scale(.88); opacity: 0 } to { transform: translateY(0) scale(1); opacity: 1 } }
  @keyframes popTag1    { from { transform: translate(-50%,-50%) rotate(-10deg) scale(.5); opacity: 0 }
                          to   { transform: translate(-50%,-50%) rotate(-10deg) scale(1);  opacity: 1 } }
  @keyframes popTag2    { from { transform: translate(-50%,-50%) rotate(8deg)  scale(.5); opacity: 0 }
                          to   { transform: translate(-50%,-50%) rotate(8deg)  scale(1);  opacity: 1 } }
  @keyframes fadeTagline{ from { opacity: 0 } to { opacity: 1 } }
  @keyframes exitAll    { from { opacity: 1; transform: scale(1)    }
                          to   { opacity: 0; transform: scale(1.06) } }
  @keyframes progressBar{ from { width: 0 } to { width: 100% } }

  /* ── Shell ── */
  .intro-shell {
    flex: 1;
    background: var(--cream);
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .intro-shell.exiting { animation: exitAll .55s cubic-bezier(.4,0,1,1) forwards; }

  /* ── Wavy SVG borders ── */
  .wave { position: absolute; left: 0; width: 100%; height: 48px; z-index: 5; display: block; }
  .wave-top { top: 0; }
  .wave-bottom { bottom: 0; transform: rotate(180deg); }

  /* ── Display type ── */
  .hero-text {
    position: relative; z-index: 2;
    text-align: center;
    line-height: .88;
    user-select: none;
    pointer-events: none;
  }
  .word-pasar, .word-malam {
    display: block;
    font-weight: 900;
    font-size: clamp(4.5rem, 17vw, 13rem);
    letter-spacing: -.04em;
  }
  .word-pasar  { color: var(--green-primary); animation: slideLeft  .75s cubic-bezier(.16,1,.3,1) .15s both; }
  .word-malam  { color: var(--terracotta);    animation: slideRight .75s cubic-bezier(.16,1,.3,1) .35s both; }

  /* ── Food photo (floating circle) ── */
  .food-photo {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    width: clamp(160px, 28vw, 320px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    box-shadow: 0 24px 64px #0e261d55;
    animation: riseFade .85s cubic-bezier(.16,1,.3,1) .55s both;
    overflow: hidden;
  }
  .food-photo .label {
    color: var(--muted);
    font-size: clamp(.65rem, 1.5vw, .85rem);
    font-weight: 500;
    line-height: 1.5;
    padding: .75rem;
  }

  /* ── Floating tags ── */
  .tag {
    position: absolute;
    z-index: 4;
    padding: 9px 20px;
    border-radius: 999px;
    font-size: clamp(.75rem, 1.8vw, .9rem);
    font-weight: 800;
    letter-spacing: .01em;
    white-space: nowrap;
    box-shadow: 0 4px 14px #17443e1a;
  }
  .tag-fresh {
    background: var(--gold);
    color: var(--green-ink);
    top: 30%; left: 18%;
    transform: translate(-50%,-50%) rotate(-10deg);
    animation: popTag1 .5s cubic-bezier(.34,1.56,.64,1) 1.1s both;
  }
  .tag-halal {
    background: var(--green-primary);
    color: var(--gold);
    bottom: 27%; right: 14%;
    transform: translate(-50%,-50%) rotate(8deg);
    animation: popTag2 .5s cubic-bezier(.34,1.56,.64,1) 1.3s both;
  }

  /* ── Tagline ── */
  .tagline {
    position: absolute;
    bottom: 11%;
    left: 50%; transform: translateX(-50%);
    z-index: 2;
    font-size: clamp(.65rem, 1.4vw, .78rem);
    font-weight: 850;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    animation: fadeTagline .6s ease 1.6s both;
  }

  /* ── Progress bar ── */
  .progress-track {
    position: absolute;
    bottom: 5.5%; left: 50%; transform: translateX(-50%);
    width: min(200px, 45%);
    height: 2px;
    background: var(--border);
    border-radius: 999px;
    z-index: 6;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green-primary);
    border-radius: 999px;
    animation: progressBar 4s linear .5s both;
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .word-pasar, .word-malam, .food-photo, .tag, .tagline { animation: none; opacity: 1; }
    .intro-shell.exiting { animation: none; opacity: 0; }
    .progress-fill { animation: none; width: 100%; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">

<div class="intro-shell" id="shell">

  <!-- Wavy top -->
  <svg class="wave wave-top" viewBox="0 0 1440 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,24 C80,0 160,48 240,24 C320,0 400,48 480,24 C560,0 640,48 720,24 C800,0 880,48 960,24 C1040,0 1120,48 1200,24 C1280,0 1360,48 1440,24 L1440,0 L0,0 Z" fill="#17443e"/>
  </svg>

  <!-- Massive display type -->
  <div class="hero-text" aria-label="Pasar Malam">
    <span class="word-pasar">PASAR</span>
    <span class="word-malam">MALAM</span>
  </div>

  <!-- Food photo placeholder -->
  <div class="food-photo" aria-hidden="true">
    <span class="label">Nasi Lemak<br>Pasar Malam</span>
  </div>

  <!-- Floating tags -->
  <div class="tag tag-fresh" aria-hidden="true">Freshly Made</div>
  <div class="tag tag-halal" aria-hidden="true">Halal ✓</div>

  <!-- Tagline -->
  <p class="tagline">Good food · Good neighbours · Less waste</p>

  <!-- Progress bar -->
  <div class="progress-track" aria-hidden="true">
    <div class="progress-fill"></div>
  </div>

  <!-- Wavy bottom -->
  <svg class="wave wave-bottom" viewBox="0 0 1440 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,24 C80,0 160,48 240,24 C320,0 400,48 480,24 C560,0 640,48 720,24 C800,0 880,48 960,24 C1040,0 1120,48 1200,24 C1280,0 1360,48 1440,24 L1440,0 L0,0 Z" fill="#17443e"/>
  </svg>
</div>

<script>
  const DURATION = 4500   // ms total before callback fires
  const EXIT_AT  = 3900   // ms when exit animation starts

  const shell = document.getElementById('shell')

  // Exit animation
  setTimeout(() => shell.classList.add('exiting'), EXIT_AT)

  // Transition callback — in real app this would call onComplete()
  setTimeout(() => {
    shell.style.display = 'none'
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;color:#7a8c83;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;">→ App loads here</div>'
  }, DURATION)
</script>

</body></html>
